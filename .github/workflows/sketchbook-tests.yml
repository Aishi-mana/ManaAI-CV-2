name: Sketchbook & Songbook focused tests
on:
  pull_request:
    paths:
      - 'src/core/sketchbook*.ts'
      - 'src/core/songbook*.ts'
      - 'src/core/coverDiscovery.ts'
      - 'src/core/coverHandoff.ts'
      - 'src/core/weeklyCovers.ts'
      - 'src/core/coverSelection.ts'
      - 'src/core/animeCoverPreference.ts'
      - 'src/core/songbookIdeas.ts'
      - 'src/core/translationWorkbench.ts'
      - 'src/core/translationHandoff.ts'
      - 'src/components/TranslationVoicePanel.tsx'
      - 'src/core/midiMelody.ts'
      - 'src/core/melodyGuide.ts'
      - 'src/core/openUtauExport.ts'
      - 'src/core/translationIdeas.ts'
      - 'src/components/TranslationWorkbench.tsx'
      - 'src/components/MelodyGuidePanel.tsx'
      - 'src/core/musicStudio.ts'
      - 'src/components/SingingDrawer.tsx'
      - 'src/core/originalSong.ts'
      - 'src/components/SongbookWorkspace.tsx'
      - 'tests/songbook*.test.cjs'
      - 'tests/cover-discovery.test.cjs'
      - 'tests/cover-handoff.test.cjs'
      - 'tests/weekly-covers.test.cjs'
      - 'tests/anime-cover-preference.test.cjs'
      - 'tests/songbook-ideas.test.cjs'
      - 'tests/translation-*.test.cjs'
      - 'src/core/imageReliability.ts'
      - 'src/core/imageSession.ts'
      - 'src/core/imageGeneration.ts'
      - 'src/core/useLlama.ts'
      - 'src/components/ImageGenerationDrawer.tsx'
      - 'src/components/SketchbookWorkspace.tsx'
      - 'src/App.tsx'
      - 'tests/sketchbook*.test.cjs'
      - 'src/core/backup.ts'
      - 'src-tauri/src/store.rs'
      - '.github/workflows/sketchbook-tests.yml'
  workflow_dispatch:
jobs:
  focused-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Run creative-book test suites
        run: node --test tests/sketchbook*.test.cjs tests/songbook*.test.cjs tests/cover-discovery.test.cjs tests/cover-handoff.test.cjs tests/weekly-covers.test.cjs tests/anime-cover-preference.test.cjs tests/songbook-ideas.test.cjs tests/translation-*.test.cjs
      - name: Compile TypeScript and frontend
        run: npm run build
